name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: sim-core and cli (WS-02 §7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: ARC-001 build and test (default members)
        run: cargo build --locked && cargo test --locked
      - name: ARC-002 no UI/async/I-O framework deps in sim-core
        run: ci/arc_002_no_ui_deps.sh
      - name: ARC-003 sim-core dependency allowlist
        run: ci/arc_003_dep_allowlist.sh
      - name: ARC-004 clippy rejects banned items in sim-core
        run: ci/arc_004_lint_probe.sh
      - name: ARC-010 no content IDs hard-coded in crates/*/src
        run: ci/arc_010_no_hardcoded_ids.sh

  app:
    name: Tauri stub builds (ARC-100)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install webkit system libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p orchestra-app -- -D warnings
      - run: cargo build --locked -p orchestra-app
